name: Windows x64 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build and test (Windows x64 / MSVC)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC environment
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Remove MinGW from PATH
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {$_ -notlike "*mingw*"})
          Write-Host "PATH cleaned: $env:PATH"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.28.1
        with:
          cmakeVersion: "3.28.1"
          ninjaVersion: "1.11.1"

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DSECRET_BUILD_TESTS=ON ^
            -DSECRET_BUILD_BENCHMARKS=OFF

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows binary
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = (Get-Content 'VERSION.txt' -Raw).Trim()
          $packageName = "Secret-v$version-windows-x64"
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "dist\$packageName"
          $exePath = Join-Path $env:GITHUB_WORKSPACE 'build\secret.exe'

          if (-not (Test-Path $exePath)) {
            # Ninja kladet secret.exe napryamuyu v build\ secret.exe, no proverim obya varianta
            $exePath = Join-Path $env:GITHUB_WORKSPACE 'build\Release\secret.exe'
          }

          if (-not (Test-Path $exePath)) {
            throw "Build output not found: $exePath"
          }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item $exePath -Destination $packageDir
          Copy-Item 'README.md', 'CREDITS.md', 'VERSION.txt' -Destination $packageDir -ErrorAction SilentlyContinue
          
          if (Test-Path 'third_party') {
            Copy-Item 'third_party' -Destination $packageDir -Recurse
          }

          $buildInfo = @"
          Product: Secret CPU Path Tracer
          Version: $version
          Platform: Windows 10+ x64
          Compiler: Visual Studio 2022 / MSVC (Ninja)
          Configuration: Release
          Git commit: $env:GITHUB_SHA
          "@
          Set-Content -Path (Join-Path $packageDir 'BUILD-INFO.txt') -Value $buildInfo -Encoding utf8

          "name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/
          if-no-files-found: error
          retention-days: 30
